<!DOCTYPE html>
<html>
<head>
    <title>Wordly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Wordly Dictionary</h1>

    <form id="search-form">
        <input type="text" id="word-input" placeholder="Type a word">
        <button type="submit" id="search-btn">Search</button>
    </form>

    <p id="loading" class="hide">Searching...</p>
    <div id="error-msg" class="hide"></div>

    <div id="result" class="hide">
        <h2 id="word"></h2>
        <p id="phonetic"></p>
        <audio id="audio" controls class="hide"></audio>
        <p id="part-of-speech"></p>
        <p id="definition"></p>
        <p id="example"></p>
        <p id="synonyms"></p>
        <br><br>
        <button id="theme-btn">Dark Mode</button>
        <button id="save-btn">Save Word</button>
    </div>

    <h3>Saved Words</h3>
    <ul id="saved-list"></ul>

    <script src="index.js"></script>
</body>
</html>
